name: Release VSIX from Version Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-draft-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false --registry=https://registry.npmjs.org

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: |
          VSIX_NAME="sjmcl-dev-extension-${GITHUB_REF_NAME}.vsix"
          npx @vscode/vsce package --out "${VSIX_NAME}"
          echo "VSIX_NAME=${VSIX_NAME}" >> "${GITHUB_ENV}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.ref_name }}
          path: ${{ env.VSIX_NAME }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: ${{ env.VSIX_NAME }}
